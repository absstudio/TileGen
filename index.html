<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TileGen — Générateur de noms de carreaux</title>
<style>
  /* ===== Thèmes (identité conservée : F2F2F2 clair / 0F0E0E sombre) ===== */
  :root, [data-theme="light"] {
    --bg: #F2F2F2;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #b45309;
    --accent-text: #ffffff;
    --accent-soft: #fef3c7;
    --name-text: #92400e;
    --border: #e7e5e4;
    --input-bg: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"] {
    --bg: #0F0E0E;
    --card: #1c1a1a;
    --text: #F2F2F2;
    --muted: #a8a29e;
    --accent: #f59e0b;
    --accent-text: #0F0E0E;
    --accent-soft: #3a2d14;
    --name-text: #fbbf24;
    --border: #323030;
    --input-bg: #262424;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #0F0E0E;
      --card: #1c1a1a;
      --text: #F2F2F2;
      --muted: #a8a29e;
      --accent: #f59e0b;
      --accent-text: #0F0E0E;
      --accent-soft: #3a2d14;
      --name-text: #fbbf24;
      --border: #323030;
      --input-bg: #262424;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }

  /* ===== Base ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: clamp(1.5rem, 4vw, 3rem) 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; }

  /* Accessibilité : focus visible partout */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ===== En-tête ===== */
  header { margin-bottom: 2.5rem; }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: .75rem;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 700;
    text-wrap: balance;
  }
  h1 .gen { color: var(--accent); }
  .theme-toggle {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .8rem;
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1;
    transition: transform .15s ease-out;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  header p {
    color: var(--muted);
    font-size: 1rem;
    text-wrap: pretty;
    max-width: 40ch;
  }

  /* ===== Barre d'actions ===== */
  .controls {
    display: flex; gap: .75rem; align-items: center;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
  }
  .controls label {
    font-size: .875rem;
    color: var(--muted);
    font-weight: 600;
  }
  .controls input {
    width: 5rem; padding: .55rem .75rem;
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: center;
    background: var(--input-bg);
    color: var(--text);
  }
  button {
    padding: .55rem 1.25rem;
    border: 1px solid transparent;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
    transition: transform .15s ease-out, opacity .15s ease-out;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); opacity: .9; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border-color: var(--border);
  }

  /* ===== Catalogue ===== */
  .stats {
    color: var(--muted);
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    margin-bottom: .75rem;
    min-height: 1.25rem;
  }
  .catalog {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .catalog-item {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 1rem;
    align-items: baseline;
    animation: item-in .15s ease-out both;
  }
  .catalog-item:last-child { border-bottom: none; }
  @keyframes item-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .catalog-item .name {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--name-text);
    background: var(--accent-soft);
    padding: .25rem .75rem;
    border-radius: 6px;
    min-width: 7.5rem;
    text-align: center;
    flex-shrink: 0;
  }
  .catalog-item .desc {
    color: var(--muted);
    font-size: .95rem;
    text-wrap: pretty;
  }

  /* État vide : une seule action claire */
  .empty {
    text-align: center;
    padding: 3.5rem 1.5rem;
    color: var(--muted);
  }
  .empty .hint { margin-bottom: 1.25rem; }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: .85rem;
    text-wrap: pretty;
  }
  footer a { color: var(--accent); }

  /* Respect de prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-row">
      <h1>Tile<span class="gen">Gen</span></h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Basculer entre le thème clair et le thème sombre" title="Basculer clair / sombre">🌙</button>
    </div>
    <p>Générez des noms uniques et prononçables pour votre catalogue de carreaux céramiques, avec descriptions incluses.</p>
  </header>

  <div class="controls">
    <label for="count">Nombre</label>
    <input type="number" id="count" value="5" min="1" max="50">
    <button onclick="generate()">Générer</button>
    <button class="secondary" onclick="resetHistory()">Réinitialiser l'historique</button>
  </div>

  <div class="stats" id="stats" aria-live="polite"></div>

  <div class="catalog" id="catalog">
    <div class="empty">
      <div class="hint">Prêt à générer vos premiers noms de carreaux.</div>
      <button onclick="generate()">Générer maintenant</button>
    </div>
  </div>

  <footer>
    TileGen — <a href="https://github.com/absstudio/TileGen">Code source sur GitHub</a>
  </footer>
</div>

<script>
// ===== Thème clair / sombre =====
const THEME_KEY = "tilegen_theme";

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("themeToggle").textContent = prefersDark ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
initTheme();

// ===== Mêmes données que tilegen.py =====
const EXISTING_NAMES = [
  "ARTIC","ROYAL","CASTLE","ROCA","FACADE","TERRANGA","AZAR",
  "ARDOISE","SHERPA","SAFRAN","PLATINE","FUJI","TIGER",
  "TRAVARTINO","ASTON","DYNAMIC","ELECTRA","FLASH","HOGGAR",
  "MIRAGE","PLAYA","SINA MARFIL","STREET","TECHNO","VENUS",
  "VINTAGE","VOYAGE","ARAR","BLACKOS","BREAKING","CAMEL",
  "COSTA","DUNE","ERUPTION"
];
const PLACES = [
  "PETRA","ROMA","CAIRO","PARIS","VENICE","PORTO","MILAN","VIENNA","PRAGUE",
  "SEOUL","TOKYO","KYOTO","DELHI","DUBAI",
  "SAHARA","ATLAS","ANDES","ALPES","NILE","CONGO","AMAZON","GOBI",
  "TUNDRA","SIERRA","OASIS",
  "CASTLE","PALACE","TEMPLE","TOWER","OPERA","PLAZA","ARENA",
  "SOHO","MARAIS","BORGO","MEDINA","KASBAH"
];
const VINTAGE = [
  "DECO","RETRO","LOFT","MANOR","VILLA","ROYAL","NOBLE",
  "MARBLE","ONYX","BRASS","COPPER","SILVER","PEARL","IVORY",
  "ARCADE","COLUMN","MOSAIC","FRESCO","VAULT","ARCH",
  "EMPIRE","REGENT","LEGACY","CROWN","GLORY","GRAND"
];
const REAL_WORDS_TO_AVOID = new Set([
  "CASTLE","PALACE","TEMPLE","TOWER","OPERA","PLAZA","ARENA","OASIS",
  "RETRO","LOFT","VILLA","NOBLE","MARBLE","SILVER","PEARL","IVORY",
  "ARCADE","COLUMN","MOSAIC","FRESCO","VAULT","ARCH","EMPIRE",
  "LEGACY","CROWN","GLORY","GRAND","SOHO","TUNDRA","SIERRA","AMAZON",
  "ROYAL","VINTAGE","DECO","REGENT","MANOR","ONYX","BRASS","COPPER"
]);
const STYLES = [
  "Collection inspirée de la nature","Série évoquant la pureté des éléments",
  "Gamme aux tons minéraux","Collection de style épuré",
  "Série aux lignes élégantes","Gamme contemporaine raffinée"
];
const AMBIANCES = [
  "pour une ambiance sereine","créant une atmosphère apaisante",
  "apportant douceur et élégance","pour un style intemporel",
  "offrant une touche de raffinement","créant un espace harmonieux"
];
const INSPIRATIONS = [
  "Inspiré des éléments naturels","Puisant dans la beauté de la nature",
  "S'inspirant des matières nobles","Évoquant la pureté des formes",
  "Né de l'harmonie des éléments","Inspiré des textures naturelles"
];

const VOWELS = new Set("AEIOU");
const CONSONANTS = new Set("BCDFGHLMNPRSTVZ");
const STORAGE_KEY = "tilegen_noms_generes";
const MAX_ATTEMPTS = 1000;

let existingNames = new Set([...EXISTING_NAMES, ...loadHistory()]);

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveHistory() {
  const generated = [...existingNames].filter(n => !EXISTING_NAMES.includes(n));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(generated));
  updateStats();
}
function updateStats() {
  const count = existingNames.size - EXISTING_NAMES.length;
  document.getElementById("stats").textContent =
    count > 0 ? `${count} nom(s) généré(s) mémorisé(s) sur cet appareil` : "";
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function fromPlace() {
  const p = pick(PLACES);
  if (p.length > 6) {
    const start = randInt(0, p.length - 4);
    return p.slice(start, start + randInt(4, 6));
  }
  return p;
}
function fromVintage() {
  const e = pick(VINTAGE);
  if (e.length > 6) {
    const start = randInt(0, e.length - 4);
    return e.slice(start, start + randInt(4, 6));
  }
  return e;
}
function mixed() {
  const p1 = pick([...PLACES, ...VINTAGE]).slice(0, randInt(2, 3));
  const p2 = pick([...PLACES, ...VINTAGE]).slice(0, randInt(2, 3));
  return p1 + p2;
}

function isPronounceable(name) {
  if (name.length < 3) return false;
  let c = 0;
  for (const ch of name) {
    if (CONSONANTS.has(ch)) { c++; if (c > 3) return false; }
    else c = 0;
  }
  return [...name].some(ch => VOWELS.has(ch));
}

function generateName() {
  for (let i = 0; i < MAX_ATTEMPTS; i++) {
    const method = pick([fromPlace, fromVintage, mixed]);
    const name = method();
    if (!existingNames.has(name) && !REAL_WORDS_TO_AVOID.has(name) && isPronounceable(name)) {
      existingNames.add(name);
      saveHistory();
      return name;
    }
  }
  throw new Error("Aucun nom trouvé — réinitialisez l'historique.");
}
function generateMeaning() {
  return `${pick(STYLES)}. ${pick(INSPIRATIONS)}, ${pick(AMBIANCES)}.`;
}

function generate() {
  const count = parseInt(document.getElementById("count").value) || 5;
  const catalog = document.getElementById("catalog");
  let html = "";
  for (let i = 0; i < count; i++) {
    try {
      const name = generateName();
      html += `<div class="catalog-item"><span class="name">${name}</span><span class="desc">${generateMeaning()}</span></div>`;
    } catch (e) {
      html += `<div class="catalog-item"><span class="desc">${e.message}</span></div>`;
      break;
    }
  }
  catalog.innerHTML = html;
}

function resetHistory() {
  localStorage.removeItem(STORAGE_KEY);
  existingNames = new Set(EXISTING_NAMES);
  updateStats();
  document.getElementById("catalog").innerHTML =
    '<div class="empty"><div class="hint">Historique effacé.</div><button onclick="generate()">Générer maintenant</button></div>';
}

updateStats();
</script>
</body>
</html>
